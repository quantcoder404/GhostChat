<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostNet Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jolly+Lodger&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .outer-box {
            background-color: #1C1C1C;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }

        .login-container {
            text-align: center;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-container h1 {
            font-size: 50px;
            font-family: 'Jolly Lodger', cursive;
            color: #aaa;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .login-box {
            background-color: #303030;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .login-box label {
            font-size: 14px;
            color: #ddd;
            align-self: flex-start;
            margin-bottom: 5px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .forgot-password {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .forgot-password:hover {
            color: #fff;
        }

        .login-button {
            background-color: #1e50d4;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #163b9e;
        }
    </style>
</head>
<body>
    <div class="outer-box">
        <div class="login-container">
            <h1>GhostNet</h1>
            <div class="login-box">
                <form action="/login" method="POST">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter password" required>
                    </div>
                    <div class="forgot-password">Forgotten Password?</div>
                    <button type="submit" class="login-button">Log In</button>
                    <p > new user Registration?<a style="color: rgb(169, 205, 143);"  href="/registration"> register</a> </p>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
